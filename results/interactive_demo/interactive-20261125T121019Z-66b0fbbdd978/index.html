<script>
const DATA=JSON.parse(document.querySelector('#demo-data').textContent),$=id=>document.getElementById(id);
const cases=new Map(DATA.cases.map(c=>[c.id,c]));
let view='full',ticket=0,timer=null,direction=1;const loaded=new Map();
function imageReady(src){if(!loaded.has(src)){loaded.set(src,new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('图片读取失败：'+src));im.src=src;}));}return loaded.get(src);}
function group(){return DATA.groups.find(g=>g.id===$('sourceSelect').value);}
function series(){return group().sweeps[$('sweep').value];}
function selectedFrame(){return DATA.frames[series()[+$('parameter').value]];}
function selectedCase(){return cases.get(selectedFrame().case);}
function value(f){return $('sweep').value==='quality'?cases.get(f.case).quality:f[$('sweep').value];}
function choices(){let gs=DATA.groups.filter(g=>g.mode===$('mode').value);$('sourceSelect').replaceChildren(...gs.map(g=>new Option(g.title,g.id)));let choices=[['lambda','平滑强度 λ'],['kappa','β 增长倍率 κ']];if($('mode').value==='synthetic')choices.push(['quality','JPEG 质量 Q']);$('sweep').replaceChildren(...choices.map(([v,t])=>new Option(t,v)));}
function parts(c,f){let s=c.shared;return c.mode==='photo'?[['原图',s.input],['本组 L0 平滑',f.output],['原图 Canny',s.input_edges],['平滑后 Canny',f.edges]]:[['JPEG 输入',s.input],[c.mode==='paper'?'作者公开结果（非真值）':'干净真值',s.reference],['本组 L0 恢复',f.output]];}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent='▶ 自动往返演示';$('play').classList.remove('running');}
async function render(){let n=++ticket,c=selectedCase(),f=selectedFrame(),paths=parts(c,f),start=performance.now();let symbol={lambda:'λ',kappa:'κ',quality:'Q'}[$('sweep').value];$('parameterValue').textContent=`${symbol} = ${value(f)}`;$('stage').classList.add('loading');
 try{await Promise.all(paths.map(([_,p])=>imageReady(p[view])));if(n!==ticket)return;
 $('grid').className=c.mode==='photo'?'':'three';$('grid').replaceChildren(...paths.map(([title,p])=>{let el=document.createElement('figure');el.className='card';let cap=document.createElement('figcaption');cap.textContent=title;let img=document.createElement('img');img.src=p[view];img.alt=title;el.append(cap,img);return el;}));
 $('status').textContent=`${c.title} · λ=${f.lambda} · κ=${f.kappa}${c.quality?' · Q='+c.quality:''} · ${f.iterations}轮 · 原计算耗时 ${f.elapsed_seconds.toFixed(3)}秒`;
 let metric='';if(c.mode==='photo'){metric=`全图 Canny 边缘像素：原图 ${c.input_edge_count} → 平滑后 ${f.edge_count}。两图固定阈值60/120、孔径3、L2。`;$('caption').textContent='观察纹理减少与主要轮廓的保留；边缘数量减少本身不代表效果更好。κ会影响迭代次数，也可能改变输出。';}
 else{let region=view==='full'?'full':'roi',m=f.metrics[region],b=c.baseline_metrics[region],label=view==='full'?'全图':'局部';metric=`${label} ${c.mode==='paper'?'与作者的一致程度':'相对干净真值'}：PSNR ${m.psnr_db.toFixed(2)} dB · SSIM ${m.ssim.toFixed(4)}`;if(c.mode==='synthetic')metric+=`<br>JPEG 基线：${b.psnr_db.toFixed(2)} dB / ${b.ssim.toFixed(4)}`;$('caption').textContent=c.mode==='paper'?'作者输出不是干净真值；数值仅表示一致程度。官网JPEG质量和作者逐图参数未公开。':'干净真值与JPEG输入来自同一合成图；切换Q会更换真实编码的JPEG。强平滑可能同时损伤细线。';}
 $('metrics').innerHTML=metric;$('source').textContent='来源：'+c.source_note;$('stage').classList.remove('loading');window.currentFrame={id:f.id,case:c.id,lambda:f.lambda,kappa:f.kappa,quality:c.quality,view,axis:$('sweep').value};window.lastRenderMs=performance.now()-start;if(window.recordRenderedFrames)window.recordRenderedFrames.push({...window.currentFrame,time:performance.now(),render_ms:window.lastRenderMs});
 }catch(e){if(n===ticket){$('status').textContent=e.message;stop();}}
}
async function preload(){let fs=series().map(i=>DATA.frames[i]);await Promise.all(fs.flatMap(f=>parts(cases.get(f.case),f).map(([_,p])=>imageReady(p[view]))));}
async function reset(){stop();window.demoReady=false;$('parameter').disabled=true;$('play').disabled=true;let fs=series().map(i=>DATA.frames[i]),axis=$('sweep').value;$('parameter').max=fs.length-1;let desired=axis==='lambda'?(group().mode==='photo'?.02:.008):axis==='kappa'?2:30;let index=fs.findIndex(f=>value(f)===desired);$('parameter').value=Math.max(index,0);$('minimum').textContent=value(fs[0]);$('maximum').textContent=value(fs.at(-1));$('frameNote').textContent=`${fs.length}个真实预计算档位，拖动即时切换；无图像插值。`;
 $('fixed').textContent=axis==='lambda'?'固定 κ=2、βmax=100000'+(group().mode==='synthetic'?'、Q=30':''):axis==='kappa'?`固定 λ=${group().mode==='photo'?.02:.008}、βmax=100000`+(group().mode==='synthetic'?'、Q=30':''):'固定 λ=0.008、κ=2、βmax=100000';
 $('status').textContent='正在预加载参数序列…';await render();try{await preload();$('parameter').disabled=false;$('play').disabled=false;window.demoReady=true;}catch(e){$('status').textContent=e.message;}}
$('mode').onchange=()=>{choices();reset();};
$('sourceSelect').onchange=reset;$('sweep').onchange=reset;
$('parameter').oninput=()=>{stop();render();};
for(let id of ['full','roi'])$(id).onclick=async()=>{stop();view=id;$('full').classList.toggle('active',id==='full');$('roi').classList.toggle('active',id==='roi');window.demoReady=false;$('parameter').disabled=true;await render();await preload();$('parameter').disabled=false;window.demoReady=true;};
$('play').onclick=()=>{if(timer){stop();return;}$('play').textContent='⏸ 暂停自动演示';$('play').classList.add('running');timer=setInterval(()=>{let i=+$('parameter').value;if(i===series().length-1)direction=-1;if(i===0)direction=1;$('parameter').value=i+direction;render();},200);};
choices();reset();
</script></body></html>
